[project]
name = "aiorehom"
version = "0.3.0"
description = "Unofficial async client for the local API of Rehom Radiax (RadiaxWeb) controllers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fabio Rapposelli" }]
requires-python = ">=3.13"
keywords = [
    "rehom",
    "radiax",
    "radiaxweb",
    "home-assistant",
    "hvac",
    "radiant-floor",
    "vmc",
    "asyncio",
    "aiohttp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.12,<4",
    "yarl>=1.18",
]

[project.urls]
Homepage = "https://github.com/frapposelli/aiorehom"
Source = "https://github.com/frapposelli/aiorehom"
Issues = "https://github.com/frapposelli/aiorehom/issues"
Changelog = "https://github.com/frapposelli/aiorehom/blob/main/CHANGELOG.md"

[project.scripts]
rehom-probe = "aiorehom.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "aioresponses>=0.7.8",
    "mypy>=1.14",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiorehom"]

# The sdist carries the package and its metadata only: no tests, fixtures,
# golden vectors or dev tools (those live in the Git repository).
[tool.hatch.build.targets.sdist]
only-include = ["src/aiorehom", "README.md", "CHANGELOG.md", "LICENSE"]
exclude = ["__pycache__", "*.py[cod]"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["aiorehom"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["tools/golden/node_modules"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "C4", "RET", "PL",
]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
    "S603",  # subprocess with fixed argv (security keychain lookup) is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "S311", "S104", "PLC0415", "PT018", "SLF001"]
