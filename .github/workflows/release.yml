name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (Dependabot keeps them current).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"

      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          project_version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          module_version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/aiorehom/__init__.py)"
          echo "tag=${TAG} pyproject=${project_version} __version__=${module_version}"
          if [ "${TAG}" != "v${project_version}" ]; then
            echo "::error::release tag ${TAG} does not match pyproject version v${project_version}"
            exit 1
          fi
          if [ "${module_version}" != "${project_version}" ]; then
            echo "::error::aiorehom.__version__ ${module_version} does not match pyproject version ${project_version}"
            exit 1
          fi

      # The release is checked again here, not only by CI on main.
      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run --locked ruff check .

      - name: Ruff (format)
        run: uv run --locked ruff format --check .

      - name: Mypy
        run: uv run --locked mypy --strict src

      # Offline: tests/conftest.py blocks every non-loopback connection.
      - name: Pytest
        run: uv run --locked pytest -q

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aiorehom/
    permissions:
      id-token: write  # Trusted Publishing (OIDC); no API token is stored
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
